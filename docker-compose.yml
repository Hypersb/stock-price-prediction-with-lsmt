# Full-stack local development stack.
# Development-only credentials below — never reuse in production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant-research-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quant_research
    ports:
      - "5432:5432"
    volumes:
      - quant_research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d quant_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant-research-backend
    environment:
      APP_ENV: development
      APP_NAME: stock-price-prediction-research-api
      APP_VERSION: 0.1.0
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/quant_research
      MAX_MARKET_DATA_DAYS: "3650"
      MAX_FEATURE_ROWS: "500"
      MAX_PAGE_SIZE: "100"
      DEFAULT_PAGE_SIZE: "20"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: quant-research-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  quant_research_pgdata:
